<!doctype html>
<!-- 只看原则，不要抄结构与坐标。 -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Low Tide · Coastal listening walk</title>
    <style>
      @import url("../../assets/fonts/fonts.css");
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          100%/1.45 "Noto Sans SC",
          Arial,
          sans-serif;
      }
      h1,
      h2,
      p,
      figure {
        margin: 0;
      }
      button,
      input {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible,
      summary:focus-visible {
        outline: 3px solid currentColor;
        outline-offset: 5px;
      }
      .num {
        font-family: "Barlow Condensed", "Noto Sans SC", "Arial Narrow", sans-serif;
        font-variant-numeric: tabular-nums;
      }
      .meta {
        font:
          700 0.78rem/1.3 "Barlow Condensed",
          "Noto Sans SC",
          "Arial Narrow",
          sans-serif;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
      .serif {
        font-family: "Noto Serif SC", Georgia, serif;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }

      body {
        background: #e9d1b8;
        color: #37212a;
      }
      main {
        min-height: 100svh;
        display: grid;
        grid-template-columns: 1fr 1.1fr;
        grid-template-rows: auto 1fr auto;
        position: relative;
        isolation: isolate;
        overflow: hidden;
        background: repeating-linear-gradient(90deg, #68462f0a 0 1px, transparent 1px 4px);
      }
      header {
        grid-column: 2;
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        margin: 5vmin 4vw 0 3vw;
        border-bottom: 1px solid;
        padding-bottom: 1rem;
      }
      .field {
        grid-column: 1;
        grid-row: 1/4;
        align-self: stretch;
        display: flex;
        align-items: stretch;
        justify-content: space-around;
        margin: -6vh -1vw -5vh -4vw;
        transform: rotate(-7deg);
        border-right: 0.8vw solid #563742;
        background: repeating-linear-gradient(0deg, #582936 0 7px, #713849 7px 11px);
        position: relative;
        z-index: -1;
      }
      .loop {
        width: 25%;
        height: 85%;
        border: 1.7vw solid #e7c8a3;
        border-top: 0;
        border-radius: 0 0 50% 50%;
        box-shadow:
          0.65vw 0.8vw #301d2a,
          inset 0.5vw 0 #b77e69;
        transform-origin: top;
        animation: sway 0.58s cubic-bezier(0.23, 0.69, 0.4, 1) both;
      }
      .loop:nth-child(2) {
        height: 59%;
        animation-delay: 75ms;
      }
      .loop:nth-child(3) {
        height: 72%;
        animation-delay: 140ms;
      }
      h1 {
        grid-column: 2;
        grid-row: 2;
        align-self: center;
        margin: 2rem 1rem 2rem -4vw;
        font:
          800 clamp(6rem, min(15vw, 25vh), 14rem)/0.83 "Barlow Condensed",
          "Noto Sans SC",
          "Arial Narrow",
          sans-serif;
        text-transform: uppercase;
        letter-spacing: -0.045em;
        color: #462533;
        text-shadow: 2px 2px #f4d9b4;
      }
      h1 span {
        color: #a84d34;
      }
      footer {
        grid-column: 2;
        display: flex;
        align-items: center;
        gap: 2rem;
        border-top: 2px solid;
        margin: 0 4vw 5vmin 3vw;
        padding-top: 0.9rem;
      }
      footer strong {
        font-size: clamp(1.9rem, 3.7vw, 3rem);
        white-space: nowrap;
      }
      footer p {
        font-size: 0.9rem;
      }
      @keyframes sway {
        0% {
          transform: rotate(-7deg);
        }
        70% {
          transform: rotate(2deg);
        }
      }
      @media (max-width: 650px) {
        main {
          grid-template-columns: 0.65fr 1fr;
        }
        header,
        footer {
          display: block;
        }
        header span {
          display: block;
          margin: 0.25rem 0;
        }
        h1 {
          font-size: 23vw;
          margin-left: -2vw;
        }
        footer {
          margin-bottom: 2rem;
        }
      }
      h1 {
        margin-left: 3vw;
        letter-spacing: -0.015em;
        line-height: 0.91;
        animation: pull 0.31s ease-out backwards;
      }
      @keyframes pull {
        from {
          transform: translateX(0.12em);
        }
      }
      footer {
        background: #e9d1b8;
        padding-left: 0.4rem;
      }
      header {
        position: relative;
      }
      @media (max-width: 650px) {
        h1 {
          margin-left: 5vw;
        }
        footer {
          margin-left: 0;
          padding-left: 5vw;
        }
      }
      footer .meeting { font-size: clamp(1.15rem, 2.2vw, 2.4rem); line-height: 1.1; }
      footer .meeting small { font-size: .65em; }
      @media (max-width: 650px) { footer strong { line-height: 1; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <span class="meta">◎ &nbsp; Coastal listening walk</span><span class="meta">North Jetty</span>
      </header>
      <div class="field" aria-hidden="true">
        <i class="loop" data-shape data-hero></i><i class="loop" data-shape></i
        ><i class="loop" data-shape></i>
      </div>
      <h1 data-shape>Low<br />Tide<span>.</span></h1>
      <footer data-shape>
        <strong class="num">28 NOV<br />07:40</strong>
        <p class="meeting"><small>Meet at</small><br /><b>North Jetty</b></p>
      </footer>
    </main>
  </body>
</html>
