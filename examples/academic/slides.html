<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>效率与精度的取舍 · 演示样张</title>
<style>
  :root { --paper:#ece5d6; --ink:#20211f; --navy:#182c45; --rust:#a64f32; --muted:#dcd5c5; }
  * { box-sizing:border-box; }
  body { margin:0; color:var(--ink); background:#101923; font-family:"PingFang SC","Noto Sans SC",sans-serif; }
  main { width:1600px; margin:0 auto; }
  .slide { width:1600px; height:900px; position:relative; overflow:hidden; }
  .slide + .slide { margin-top:32px; }
  .paper { background:var(--paper); }
  .paper::before { content:""; position:absolute; inset:0; opacity:.025; pointer-events:none; background-image:radial-gradient(#20211f .7px,transparent .8px); background-size:5px 7px; }
  .topline { position:absolute; left:80px; right:80px; top:50px; display:flex; align-items:center; justify-content:space-between; border-bottom:2px solid currentColor; padding-bottom:18px; font-size:22px; font-weight:600; }
  .section-label { display:flex; align-items:center; gap:18px; }
  .section-label::before { content:""; height:24px; width:8px; background:var(--rust); }
  .status { font-size:21px; font-weight:500; }
  h1,h2,p { margin:0; }
  h1 { position:absolute; top:124px; left:80px; right:80px; font-size:56px; line-height:1.5; font-weight:800; letter-spacing:-1px; }
  .footer { position:absolute; left:80px; right:80px; bottom:38px; display:flex; justify-content:space-between; gap:24px; align-items:end; font-size:20px; line-height:1.6; }
  .folio { font-family:"DIN Condensed","Arial Narrow",sans-serif; font-size:30px; white-space:nowrap; }
  .question { position:absolute; top:275px; left:80px; width:485px; }
  .small-label { color:var(--rust); font-size:22px; font-weight:700; letter-spacing:2px; }
  .question h2 { font-family:"Songti SC","Noto Serif SC",serif; font-size:48px; font-weight:600; line-height:1.5; margin:22px 0 32px; }
  .question p { font-size:28px; line-height:1.7; max-width:470px; }
  .question .rule { width:84px; height:5px; background:var(--rust); margin-bottom:28px; }
  .method { position:absolute; left:640px; top:258px; width:880px; height:445px; background:var(--navy); color:var(--paper); box-shadow:12px 12px 0 #b8b5ac; }
  .method-title { position:absolute; left:36px; top:25px; font-size:23px; font-weight:600; }
  .method svg { position:absolute; left:20px; top:72px; width:840px; height:290px; }
  .method-note { position:absolute; bottom:25px; left:36px; font-size:21px; color:#d5d6d7; }
  .method-caption { position:absolute; top:738px; left:640px; width:880px; font-size:24px; line-height:1.55; }
  .dark { color:var(--paper); background:var(--navy); }
  .dark .topline { border-color:#7c8b9c; }
  .results { position:absolute; top:238px; left:80px; width:1440px; height:398px; background:var(--paper); color:var(--ink); }
  .results svg { display:block; width:100%; height:100%; }
  .conclusion { position:absolute; left:80px; top:676px; right:80px; display:grid; grid-template-columns:175px 1fr; gap:20px; }
  .conclusion .lead { font-family:"Songti SC","Noto Serif SC",serif; font-size:31px; line-height:1.5; }
  .conclusion strong { font-size:31px; line-height:1.5; font-weight:600; }
  .conclusion p { font-size:24px; line-height:1.6; margin-top:7px; color:#d6dbe1; }
  svg text { font-family:"PingFang SC","Noto Sans SC",sans-serif; }
  svg .number { font-family:"DIN Condensed","Arial Narrow",sans-serif; font-weight:700; }
  svg .tick { font-size:19px; fill:#595b59; }
  @media (max-width:1600px) { main { margin-left:0; } }
  @media print { @page { size:1600px 900px; margin:0; } body { background:none; } .slide { break-after:page; -webkit-print-color-adjust:exact; print-color-adjust:exact; } .slide + .slide { margin-top:0; } }
</style>
</head>
<body>
<main aria-label="两页学术汇报静态样张">
  <section class="slide paper" id="slide-1" aria-labelledby="title-1">
    <div class="topline"><span class="section-label">研究问题与比较框架</span><span class="status">虚构示例 · 数据仅供演示</span></div>
    <h1 id="title-1">效率与精度的取舍</h1>
    <div class="question">
      <div class="small-label">研究问题</div>
      <h2>降低延迟，<br>需要付出多少<br>准确率代价？</h2>
      <div class="rule"></div>
      <p>比较两种方法时，<br>同时观察响应速度<br>与预测准确率。</p>
    </div>
    <figure class="method" aria-labelledby="method-title" style="margin:0">
      <figcaption id="method-title" class="method-title">方法示意 · 两种方案，共同评价维度</figcaption>
      <svg viewBox="0 0 840 290" role="img" aria-label="输入分为基线方法与新方法两条路径，各自输出，再比较延迟和准确率。此图不表示具体算法结构。">
        <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ece5d6"/></marker></defs>
        <g fill="none" stroke="#ece5d6" stroke-width="2.5">
          <path d="M147 145H201V68H263" marker-end="url(#arrow)"/>
          <path d="M201 145V222H263" marker-end="url(#arrow)"/>
          <path d="M467 68H548" marker-end="url(#arrow)"/>
          <path d="M467 222H548" marker-end="url(#arrow)"/>
          <path d="M686 68H751V222H686"/>
        </g>
        <rect x="20" y="106" width="127" height="78" fill="#ece5d6"/>
        <text x="83.5" y="155" fill="#20211f" font-size="28" text-anchor="middle">输入</text>
        <rect x="267" y="27" width="200" height="82" fill="#ece5d6"/>
        <text x="367" y="78" fill="#20211f" font-size="30" font-weight="600" text-anchor="middle">基线方法</text>
        <rect x="267" y="181" width="200" height="82" fill="#a64f32" stroke="#ece5d6" stroke-width="1.5"/>
        <text x="367" y="232" fill="#ece5d6" font-size="30" font-weight="600" text-anchor="middle">新方法</text>
        <rect x="552" y="27" width="134" height="82" fill="none" stroke="#ece5d6" stroke-width="2"/>
        <rect x="552" y="181" width="134" height="82" fill="none" stroke="#ece5d6" stroke-width="2"/>
        <text x="619" y="78" fill="#ece5d6" font-size="28" text-anchor="middle">输出</text>
        <text x="619" y="232" fill="#ece5d6" font-size="28" text-anchor="middle">输出</text>
        <text x="770" y="155" fill="#ece5d6" font-size="25">对比</text>
      </svg>
      <p class="method-note">共同评价：延迟（ms）↓ · 准确率（%）↑</p>
    </figure>
    <p class="method-caption">要解释性能差异，需要确认测试条件一致。<br>本示例未提供具体算法与测试条件。</p>
    <div class="footer"><span>图示仅表达比较关系，不代表具体算法结构。</span><span class="folio">01 / 02</span></div>
  </section>
  <section class="slide dark" id="slide-2" aria-labelledby="title-2">
    <div class="topline"><span class="section-label">结果与条件</span><span class="status">虚构示例 · 数据仅供演示</span></div>
    <h1 id="title-2">延迟降低 40%，准确率下降 1 个百分点</h1>
    <figure class="results" style="margin:0" aria-label="基线延迟100毫秒、准确率90%；新方法延迟60毫秒、准确率89%。">
      <svg viewBox="0 0 1440 398" role="img" aria-labelledby="results-title results-description">
        <title id="results-title">基线与新方法的效率、准确率对比</title>
        <desc id="results-description">两个条形图均从零开始。延迟由100毫秒降至60毫秒，减少40毫秒，即40%。准确率由90%降至89%，下降1个百分点。所有数据仅供演示。</desc>
        <line x1="720" y1="36" x2="720" y2="360" stroke="#b4b0a5"/>
        <text x="42" y="51" font-size="29" font-weight="700">延迟</text><text x="116" y="51" font-size="22">越低越好</text>
        <text x="675" y="53" text-anchor="end" fill="#a64f32" font-size="30" font-weight="700">−40 ms / −40%</text>
        <text x="762" y="51" font-size="29" font-weight="700">准确率</text><text x="867" y="51" font-size="22">越高越好</text>
        <text x="1395" y="53" text-anchor="end" fill="#a64f32" font-size="30" font-weight="700">−1 个百分点</text>
        <g stroke="#ccc6b8" stroke-width="1">
          <path d="M160 98V299M254 98V299M348 98V299M442 98V299M536 98V299M630 98V299"/>
          <path d="M880 98V299M974 98V299M1068 98V299M1162 98V299M1256 98V299M1350 98V299"/>
        </g>
        <g font-size="25" fill="#20211f"><text x="126" y="155" text-anchor="end">基线</text><text x="126" y="249" text-anchor="end">新方法</text><text x="846" y="155" text-anchor="end">基线</text><text x="846" y="249" text-anchor="end">新方法</text></g>
        <rect x="160" y="120" width="470" height="51" fill="#182c45"/>
        <rect x="160" y="214" width="282" height="51" fill="#a64f32"/>
        <rect x="880" y="120" width="423" height="51" fill="#182c45"/>
        <rect x="880" y="214" width="418.3" height="51" fill="#a64f32"/>
        <g class="number" fill="#ece5d6" font-size="36" text-anchor="end"><text x="615" y="157">100 ms</text><text x="427" y="251">60 ms</text><text x="1288" y="157">90%</text><text x="1283.3" y="251">89%</text></g>
        <g stroke="#20211f" stroke-width="1.5"><path d="M160 98V299H630" fill="none"/><path d="M880 98V299H1350" fill="none"/></g>
        <g class="tick" text-anchor="middle"><text x="160" y="329">0</text><text x="254" y="329">20</text><text x="348" y="329">40</text><text x="442" y="329">60</text><text x="536" y="329">80</text><text x="630" y="329">100</text><text x="880" y="329">0</text><text x="974" y="329">20</text><text x="1068" y="329">40</text><text x="1162" y="329">60</text><text x="1256" y="329">80</text><text x="1350" y="329">100</text></g>
        <text x="630" y="366" text-anchor="end" font-size="21">延迟 / ms</text><text x="1350" y="366" text-anchor="end" font-size="21">准确率 / %</text>
      </svg>
    </figure>
    <div class="conclusion"><div class="lead">有条件结论</div><div><strong>若可接受 1 个百分点的准确率损失，可进一步评估新方法。</strong><p>若准确率门槛为 90%，则新方法不满足要求。</p></div></div>
    <div class="footer"><span>仅凭演示数值，无法判断统计显著性或实际部署表现。</span><span class="folio">02 / 02</span></div>
  </section>
</main>
</body>
</html>
