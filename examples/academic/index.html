<!doctype html>
<!-- 只看原则，不要抄结构与坐标。 -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cooling a crossing · Field Notes</title>
    <style>
      @import url("../../assets/fonts/fonts.css");
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          100%/1.45 "Noto Sans SC",
          Arial,
          sans-serif;
      }
      h1,
      h2,
      p,
      figure {
        margin: 0;
      }
      button,
      input {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible,
      summary:focus-visible {
        outline: 3px solid currentColor;
        outline-offset: 5px;
      }
      .num {
        font-family: "Barlow Condensed", "Noto Sans SC", "Arial Narrow", sans-serif;
        font-variant-numeric: tabular-nums;
      }
      .meta {
        font:
          700 0.78rem/1.3 "Barlow Condensed",
          "Noto Sans SC",
          "Arial Narrow",
          sans-serif;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
      .serif {
        font-family: "Noto Serif SC", Georgia, serif;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }

      body {
        background: #263c37;
        color: #f9edcd;
      }
      main {
        min-height: 100svh;
        padding: 5vmin 7vw;
        display: grid;
        align-content: space-between;
        gap: 4vmin;
        background-image: repeating-linear-gradient(0deg, transparent 0 35px, #ffffff08 35px 36px);
      }
      header,
      footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
      }
      header {
        border-bottom: 1px solid #b4c9aa;
        padding-bottom: 1em;
      }
      header b {
        font-size: 1.15rem;
      }
      header b::before {
        content: "◒";
        color: #e8ab85;
        margin-right: 0.5rem;
      }
      section {
        display: grid;
        grid-template-columns: 1.08fr 1fr;
        align-items: center;
        gap: 4vw;
      }
      h1 {
        font-size: clamp(2rem, 6.6vw, 7rem);
        line-height: 0.96;
        letter-spacing: -0.055em;
        max-width: 8em;
      }
      aside p {
        margin: 1.3rem 0;
        max-width: 34ch;
        color: #d3e0cf;
      }
      strong {
        font-weight: 700;
        color: #fff5d9;
      }
      figure {
        position: relative;
        overflow: hidden;
        padding: 1.1rem clamp(1rem, 3vw, 3rem) 1.5rem;
        border: 1px solid #cbd5b5;
        background: #1c302c;
        box-shadow: 0.55rem 0.55rem #192924;
      }
      figcaption {
        margin-bottom: 1rem;
      }
      .ticks {
        background: repeating-linear-gradient(to top, #dce6cc3d 0 1px, transparent 1px 20%);
        height: clamp(150px, 32vh, 330px);
        display: flex;
        align-items: end;
        gap: 12%;
        padding: 0 9%;
        border-bottom: 2px solid #cbd5b5;
      }
      .bar {
        width: 37%;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        line-height: 1;
        font-size: clamp(2rem, 5vw, 6rem);
        padding-top: 0.12em;
        color: #243b35;
        transform-origin: bottom;
        animation: rise 0.5s cubic-bezier(0.22, 0.72, 0.22, 1) backwards;
      }
      .sun {
        height: 84%;
        background: #efb285;
      }
      .shade {
        height: 62%;
        background: #d4dfaa;
        animation-delay: 0.1s;
      }
      .labels {
        display: flex;
        justify-content: space-around;
        margin: 0.5rem 0 0;
      }
      .note {
        display: inline-block;
        transform: rotate(-3deg);
        border: 1px solid #d4dfaa;
        padding: 0.3em 0.6em;
        margin-bottom: 1rem;
        color: #d4dfaa;
        animation: tag 0.32s 0.3s ease-out backwards;
      }
      @keyframes rise {
        from {
          transform: scaleY(0.2);
        }
      }
      @keyframes tag {
        from {
          transform: translateX(-1.2em) rotate(-3deg);
        }
      }
      @media (max-width: 670px) {
        section {
          grid-template-columns: 1fr;
        }
        main {
          padding: 1.5rem;
          gap: 1.5rem;
        }
        h1 {
          font-size: 3.3rem;
          max-width: 10em;
        }
        aside p {
          margin: 0.7em 0;
        }
        .ticks {
          height: 150px;
        }
      }
      header b {
        white-space: nowrap;
      }
      header .meta {
        text-align: right;
      }
      .note {
        font-weight: 500;
      }
      .ticks { position: relative; margin-left: 1.3em; }
      .axis-labels { position: absolute; inset: 0 100% 0 auto; display: flex; flex-direction: column; justify-content: space-between; padding-right: .4em; }
      .axis-labels i { font-style: normal; font-size: .9em; line-height: 0; }
    </style>
  </head>
  <body>
    <main>
      <header><b>Field Notes</b><span class="meta">Urban climate &nbsp; / &nbsp; Pilot study</span></header>
      <section>
        <aside data-shape>
          <span class="meta note">Surface temperature</span>
          <h1 data-shape>An 11°C gap.</h1>
          <p>
            At noon, the shaded surface measured <strong>11°C cooler</strong> than the sunlit surface at the same site.
          </p>
        </aside>
        <figure
          data-hero
          data-shape
          aria-label="Surface temperature on a scale from zero to fifty degrees Celsius. Sun, 42. Shade, 31."
        >
          <figcaption class="meta">Surface at noon &nbsp; · &nbsp; °C</figcaption>
          <div class="ticks"><span class="axis-labels num" aria-hidden="true"><i>50</i><i>40</i><i>30</i><i>20</i><i>10</i><i>0</i></span><b class="bar sun num">42°</b><b class="bar shade num">31°</b></div>
          <div class="labels meta"><span>Sun</span><span>Shade</span></div>
        </figure>
      </section>
      <footer data-shape class="meta">
        <span>Illustrative paired readings · 1 site</span><span>01 / 01</span>
      </footer>
    </main>
  </body>
</html>
