<!doctype html>
<!-- 只看原则，不要抄结构与坐标。 -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reservoir · Storage monitor</title>
    <style>
      @import url("../../assets/fonts/fonts.css");
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          100%/1.45 "Noto Sans SC",
          Arial,
          sans-serif;
      }
      h1,
      h2,
      p,
      figure {
        margin: 0;
      }
      button,
      input {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible,
      summary:focus-visible {
        outline: 3px solid currentColor;
        outline-offset: 5px;
      }
      .num {
        font-family: "Barlow Condensed", "Noto Sans SC", "Arial Narrow", sans-serif;
        font-variant-numeric: tabular-nums;
      }
      .meta {
        font:
          700 0.78rem/1.3 "Barlow Condensed",
          "Noto Sans SC",
          "Arial Narrow",
          sans-serif;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
      .serif {
        font-family: "Noto Serif SC", Georgia, serif;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }

      body {
        background: #102c39;
        color: #e1eddf;
      }
      main {
        min-height: 100svh;
        padding: 5vmin 6vw;
        display: grid;
        align-content: center;
        gap: 3vh;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: end;
        border-bottom: 1px solid #688f99;
        padding-bottom: 1rem;
      }
      h1 {
        font-size: clamp(2rem, 4vw, 4rem);
        letter-spacing: -0.055em;
        line-height: 1;
      }
      .readout {
        display: flex;
        align-items: baseline;
        gap: 1.5rem;
      }
      .level {
        font-size: clamp(5rem, 14vw, 12rem);
        font-weight: 700;
        line-height: 0.95;
        letter-spacing: -0.06em;
      }
      .level small {
        font-size: 0.38em;
        letter-spacing: -0.02em;
      }
      .details {
        max-width: 20ch;
        color: #bfd8d1;
      }
      .chart {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.9rem;
      }
      .axis {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        font-size: 0.75rem;
        align-items: end;
        color: #bfd8d1;
        padding-bottom: 1.9rem;
      }
      .chart ol {
        padding: 0;
        margin: 0;
        list-style: none;
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 2px;
      }
      .chart li {
        height: clamp(140px, 29vh, 290px);
        display: grid;
        grid-template-rows: 1fr 1.65rem;
        gap: 0.25rem;
        min-width: 0;
      }
      .chart button {
        position: relative;
        height: 100%;
        border: 0;
        padding: 0;
        background: repeating-linear-gradient(to top, #8aabb924 0 1px, transparent 1px 25%);
        border-block: 1px solid #78969c72;
      }
      .waterline {
        position: absolute;
        inset: auto 0 0;
        height: var(--pct);
        display: block;
        background: repeating-linear-gradient(to bottom, #6caaa5 0 4px, #548e90 4px 6px);
        border-top: 3px solid #a7c8b2;
        transform-origin: bottom;
        animation: fill 0.48s ease-out backwards;
        animation-delay: calc(var(--i) * 35ms);
      }
      button[aria-pressed="true"] .waterline {
        background: repeating-linear-gradient(to bottom, #ecc185 0 4px, #d39f65 4px 6px);
        border-color: #ffe2ac;
      }
      .day {
        text-align: center;
        font-size: 0.8rem;
        color: #bfd8d1;
      }
      footer {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        color: #bfd8d1;
        border-top: 1px solid #688f99;
        padding-top: 0.8rem;
      }
      .change {
        display: inline-block;
      }
      @keyframes fill {
        from {
          opacity: 0.52;
        }
      }
      @media (max-width: 650px) {
        header {
          align-items: start;
        }
        header span {
          max-width: 13ch;
          text-align: right;
        }
        main {
          gap: 4vh;
        }
        .readout {
          gap: 1rem;
        }
        .chart {
          gap: 0.35rem;
        }
        .day {
          font-size: 0.69rem;
        }
        footer {
          align-items: end;
        }
      }
      .readout .level {
        animation: read-level 0.27s ease-out;
      }
      @keyframes read-level {
        from {
          transform: translateY(0.09em);
        }
      }
      @media (max-width: 650px) {
        header span {
          max-width: 18ch;
        }
      }
      .chart button::after {
        content: attr(data-level) "%";
        position: absolute;
        bottom: calc(var(--pct) + .25em);
        left: 0;
        width: 100%;
        color: #e1eddf;
        font: 700 clamp(.86rem, 1.9vw, 1.6rem) "Barlow Condensed", sans-serif;
      }
    </style>
  </head>
  <body>
    <main>
      <header data-shape>
        <h1>Reservoir</h1>
        <span class="meta">≈ &nbsp; West basin / Storage monitor</span>
      </header>
      <section class="readout" data-shape aria-live="polite">
        <div class="level num"><b id="amount">68</b><small>%</small></div>
        <p class="details">
          <strong id="date">18 November</strong><br /><span id="volume">68,000 of 100,000 m³</span><br /><span id="delta"
            >+3 points since yesterday</span
          >
        </p>
      </section>
      <figure
        class="chart"
        data-hero
        data-shape
        aria-label="Daily reservoir storage. Select a day to inspect."
      >
        <div class="axis num" aria-hidden="true"><span>100%</span><span>50%</span><span>0%</span></div>
        <ol>
          <li style="--pct: 56%; --i: 0">
            <button aria-label="November 12, 56 percent" aria-pressed="false" data-level="56">
              <span class="waterline"></span></button
            ><span class="day num">12 NOV</span>
          </li>
          <li style="--pct: 54%; --i: 1">
            <button aria-label="November 13, 54 percent" aria-pressed="false" data-level="54">
              <span class="waterline"></span></button
            ><span class="day num">13 NOV</span>
          </li>
          <li style="--pct: 59%; --i: 2">
            <button aria-label="November 14, 59 percent" aria-pressed="false" data-level="59">
              <span class="waterline"></span></button
            ><span class="day num">14 NOV</span>
          </li>
          <li style="--pct: 62%; --i: 3">
            <button aria-label="November 15, 62 percent" aria-pressed="false" data-level="62">
              <span class="waterline"></span></button
            ><span class="day num">15 NOV</span>
          </li>
          <li style="--pct: 60%; --i: 4">
            <button aria-label="November 16, 60 percent" aria-pressed="false" data-level="60">
              <span class="waterline"></span></button
            ><span class="day num">16 NOV</span>
          </li>
          <li style="--pct: 65%; --i: 5">
            <button aria-label="November 17, 65 percent" aria-pressed="false" data-level="65">
              <span class="waterline"></span></button
            ><span class="day num">17 NOV</span>
          </li>
          <li style="--pct: 68%; --i: 6">
            <button aria-label="November 18, 68 percent" aria-pressed="true" data-level="68">
              <span class="waterline"></span></button
            ><span class="day num">18 NOV</span>
          </li>
        </ol>
      </figure>
      <footer data-shape class="meta">
        <span>Select a day · Net change over seven days: +12,000 m³</span><span>Illustrative data</span>
      </footer>
    </main>
    <script>
      const days = Array.from(document.querySelectorAll("[data-level]"));
      days.forEach(
        (day, i) =>
          (day.onclick = () => {
            days.forEach((item) => item.setAttribute("aria-pressed", String(item === day)));
            document.getElementById("amount").textContent = day.dataset.level;
            document.getElementById("date").textContent = 12 + i + " November";
            document.getElementById("volume").textContent = day.dataset.level + ",000 of 100,000 m³";
            const delta = i ? day.dataset.level - days[i - 1].dataset.level : 0;
            document.getElementById("delta").textContent = i
              ? (delta >= 0 ? "+" : "") + delta + " points since yesterday"
              : "First reading of the week";
          }),
      );
    </script>
  </body>
</html>
