<!doctype html>
<!-- 只看原则，不要抄结构与坐标。 -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Low Tide · Coastal listening walk</title>
    <style>
      @import url("../../assets/fonts/fonts.css");
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          100%/1.45 "Noto Sans SC",
          Arial,
          sans-serif;
      }
      h1,
      h2,
      p,
      figure {
        margin: 0;
      }
      button,
      input {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible,
      summary:focus-visible {
        outline: 3px solid currentColor;
        outline-offset: 5px;
      }
      .num {
        font-family: "Barlow Condensed", "Noto Sans SC", "Arial Narrow", sans-serif;
        font-variant-numeric: tabular-nums;
      }
      .meta {
        font:
          700 0.78rem/1.3 "Barlow Condensed",
          "Noto Sans SC",
          "Arial Narrow",
          sans-serif;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
      .serif {
        font-family: "Noto Serif SC", Georgia, serif;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }

      body {
        background: #163854;
        color: #fff3cc;
      }
      main {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        min-height: 100svh;
        padding: 5vmin 6vw;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 3vmin;
      }
      header,
      footer {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }
      header {
        border-top: 2px solid;
        padding-top: 0.7rem;
      }
      .field {
        position: absolute;
        inset: 0;
        z-index: -1;
        overflow: hidden;
      }
      .water {
        position: absolute;
        width: 105vmax;
        aspect-ratio: 1.45;
        left: 40%;
        top: 8%;
        border-radius: 46% 48% 35% 51%;
        background: repeating-radial-gradient(
          ellipse at 69% 48%,
          #f0b67a 0 0.35%,
          #437e81 0.4% 1.05%,
          #1c5266 1.1% 2.8%,
          #79a39a 2.9% 3.3%,
          #285366 3.4% 5%
        );
        transform: rotate(-24deg);
        animation: ebb 0.6s cubic-bezier(0.2, 0.75, 0.3, 1) both;
      }
      h1 {
        font-family: "Noto Serif SC", Georgia, serif;
        font-size: clamp(6rem, min(21vw, 29vh), 19rem);
        line-height: 0.85;
        letter-spacing: -0.07em;
        align-self: flex-start;
        text-shadow: 0.018em 0.022em #15354c;
      }
      h1 span {
        color: #efbc87;
      }
      footer {
        align-items: end;
        justify-content: flex-start;
        gap: 2.5rem;
      }
      footer strong {
        font-size: clamp(2rem, 3.9vw, 4.8rem);
        line-height: 1;
      }
      footer p {
        font-size: 0.95rem;
        line-height: 1.35;
        border-left: 1px solid;
        padding-left: 1rem;
      }
      @keyframes ebb {
        from {
          transform: translateX(15%) rotate(-17deg);
        }
      }
      @media (max-width: 650px) {
        .water {
          left: 32%;
          top: 21%;
        }
        header {
          align-items: start;
        }
        header .meta {
          max-width: 50%;
        }
        footer {
          gap: 0.7rem;
        }
        h1 {
          font-size: 27vw;
        }
      }
      footer strong {
        animation: datum 0.3s 0.18s ease-out backwards;
      }
      @keyframes datum {
        from {
          transform: translateY(0.35em);
        }
      }
      footer .meeting { font-size: clamp(1.15rem, 2.2vw, 2.4rem); line-height: 1.1; }
      footer .meeting small { font-size: .65em; }
      @media (max-width: 650px) { footer strong { line-height: 1; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <span class="meta">◎ &nbsp; Coastal listening walk</span><span class="meta">North Jetty</span>
      </header>
      <div class="field" aria-hidden="true"><i class="water" data-hero data-shape></i></div>
      <h1 data-shape>Low<br />Tide<span>.</span></h1>
      <footer data-shape>
        <strong class="num">28 NOV<br />07:40</strong>
        <p class="meeting"><small>Meet at</small><br /><b>North Jetty</b></p>
      </footer>
    </main>
  </body>
</html>
